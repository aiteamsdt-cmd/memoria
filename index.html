<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F3A3D;
  --ink-soft:#3E5C5A;
  --ink-faint:#7C9491;
  --paper:#FBF8F2;
  --paper-dim:#F1EAD9;
  --card:#FFFFFF;
  --gold:#C79A45;
  --gold-soft:#EAD8AE;
  --sage:#6E8F7C;
  --sage-soft:#DCE7DF;
  --green:#4C8C6E;
  --yellow:#C9962E;
  --orange:#CC7A3D;
  --red:#B84A3E;
  --shadow: 0 10px 34px rgba(31,58,61,0.10);
  --shadow-soft: 0 4px 16px rgba(31,58,61,0.08);
  --radius: 22px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Source Sans 3', -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(ellipse at top left, var(--paper-dim), transparent 60%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  font-size:19px;
  line-height:1.5;
}
.app{
  max-width:720px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}
.view{display:none; flex:1; flex-direction:column; padding:28px 24px 40px;}
.view.active{display:flex;}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0 0 6px;}
p{margin:0 0 10px;}
button{font-family:var(--font-body); cursor:pointer; border:none;}
.btn{
  border-radius:999px;
  padding:18px 30px;
  font-size:1.15rem;
  font-weight:600;
  transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ink); color:var(--paper); box-shadow:var(--shadow);}
.btn-primary:hover{background:#16292b;}
.btn-secondary{background:var(--card); color:var(--ink); border:1.5px solid var(--sage-soft); box-shadow:var(--shadow-soft);}
.btn-gold{background:var(--gold); color:#3a2a05;}
.btn-full{width:100%; text-align:center;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ---------- SPLASH ---------- */
#view-splash{justify-content:center; align-items:center; text-align:center; gap:28px; cursor:pointer; padding:40px 24px;}
.splash-logo-wrap{
  width:100%;
  max-width:520px;
  display:flex; align-items:center; justify-content:center;
  padding:26px;
  border-radius:40px;
  background:var(--card);
  box-shadow:0 26px 70px rgba(31,58,61,0.22);
  animation:splashIn .7s ease both;
}
.splash-logo{ width:100%; height:auto; display:block; border-radius:26px; }
.splash-caption{color:var(--ink-soft); font-size:.95rem; letter-spacing:.03em;}
.splash-dots{display:flex; gap:8px;}
.splash-dots span{width:8px; height:8px; border-radius:50%; background:var(--gold-soft); animation:splashDot 1.2s infinite ease-in-out;}
.splash-dots span:nth-child(2){animation-delay:.15s;}
.splash-dots span:nth-child(3){animation-delay:.3s;}
@keyframes splashDot{0%,80%,100%{transform:scale(0.6); opacity:.5;} 40%{transform:scale(1); opacity:1; background:var(--gold);}}
@keyframes splashIn{from{opacity:0; transform:scale(0.9);} to{opacity:1; transform:scale(1);}}

/* ---------- HOME ---------- */
#view-home{justify-content:center; align-items:center; text-align:center; gap:6px;}
.home-thread{width:120px; height:120px; margin-bottom:6px;}
.home-eyebrow{font-size:.85rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:6px;}
.home-greeting{font-size:2rem; max-width:480px; margin-bottom:4px;}
.home-sub{color:var(--ink-soft); max-width:420px; margin-bottom:34px;}
.mic-giant{
  width:190px; height:190px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #2c4b4d, var(--ink));
  color:var(--paper);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow:0 18px 50px rgba(31,58,61,0.28);
  font-family:var(--font-display); font-size:1.15rem; gap:10px;
}
.mic-giant svg{width:52px; height:52px;}
.home-links{display:flex; gap:14px; margin-top:38px; flex-wrap:wrap; justify-content:center;}
.link-ghost{background:none; color:var(--ink-soft); font-size:.95rem; text-decoration:underline; padding:6px;}
.edit-name{position:absolute; top:22px; right:22px; background:none; color:var(--ink-faint); font-size:.85rem; text-decoration:underline;}

/* ---------- CONVERSATION ---------- */
#view-conversation{justify-content:space-between;}
.conv-top{display:flex; justify-content:space-between; align-items:center;}
.module-pill{background:var(--sage-soft); color:var(--ink-soft); font-size:.8rem; font-weight:600; padding:6px 14px; border-radius:999px; letter-spacing:.02em;}
.exit-link{background:none; color:var(--ink-faint); font-size:.9rem; text-decoration:underline;}
.conv-progress{height:5px; background:var(--paper-dim); border-radius:4px; margin:16px 0 4px; overflow:hidden;}
.conv-progress-fill{height:100%; background:var(--gold); border-radius:4px; transition:width .4s ease;}
.conv-body{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:22px; padding:20px 0;}
.ai-bubble{
  background:var(--card); border-radius:26px; padding:26px 28px; box-shadow:var(--shadow);
  font-family:var(--font-display); font-size:1.5rem; line-height:1.4; max-width:520px;
  position:relative;
}
.ai-bubble.thinking{color:var(--ink-faint); font-style:italic;}
.pulse-ring{width:16px; height:16px; border-radius:50%; background:var(--sage);}
.user-live{display:none;}
.type-fallback{display:none; width:100%; max-width:480px; gap:10px; margin-top:6px;}
.type-fallback.active{display:flex;}
.type-fallback input{flex:1; padding:14px 18px; border-radius:14px; border:1.5px solid var(--sage-soft); font-size:1rem; font-family:var(--font-body);}
.conv-bottom{display:flex; flex-direction:column; align-items:center; gap:14px;}
.mic-btn{
  width:88px; height:88px; border-radius:50%; background:var(--ink); color:var(--paper);
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  transition:background .2s ease, transform .15s ease;
}
.mic-btn.listening{background:var(--red); animation:pulse 1.3s infinite;}
.mic-btn svg{width:32px; height:32px;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,74,62,.45);}70%{box-shadow:0 0 0 22px rgba(184,74,62,0);}100%{box-shadow:0 0 0 0 rgba(184,74,62,0);}}
.mic-hint{color:var(--ink-faint); font-size:.9rem;}
.toggle-type{background:none; color:var(--ink-faint); text-decoration:underline; font-size:.85rem;}

/* ---------- SUMMARY ---------- */
.summary-score{
  width:180px; height:180px; border-radius:50%; margin:14px auto 20px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:conic-gradient(var(--gold) calc(var(--pct) * 1%), var(--paper-dim) 0);
  position:relative;
}
.summary-score::after{content:''; position:absolute; inset:14px; border-radius:50%; background:var(--paper);}
.summary-score-num{position:relative; z-index:1; font-family:var(--font-display); font-size:2.6rem;}
.summary-score-label{position:relative; z-index:1; font-size:.8rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em;}
.metric-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:22px 0;}
.metric-card{background:var(--card); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow-soft);}
.metric-card .val{font-family:var(--font-display); font-size:1.5rem;}
.metric-card .lab{color:var(--ink-soft); font-size:.82rem;}
.alert-banner{border-radius:16px; padding:16px 20px; display:flex; gap:12px; align-items:flex-start; margin-bottom:6px;}
.alert-dot{width:14px; height:14px; border-radius:50%; margin-top:5px; flex-shrink:0;}
.alert-green{background:#E5F1EA; color:#2E5C42;} .alert-green .alert-dot{background:var(--green);}
.alert-yellow{background:#FBF1DE; color:#6B4F0F;} .alert-yellow .alert-dot{background:var(--yellow);}
.alert-orange{background:#FBE8DA; color:#7A3E14;} .alert-orange .alert-dot{background:var(--orange);}
.alert-red{background:#F7E1DE; color:#7A241A;} .alert-red .alert-dot{background:var(--red);}

/* ---------- DASHBOARD ---------- */
.dash-tabs{display:flex; gap:8px; margin-bottom:20px;}
.dash-tab{flex:1; padding:12px; border-radius:14px; background:var(--card); color:var(--ink-soft); font-weight:600; box-shadow:var(--shadow-soft); text-align:center;}
.dash-tab.active{background:var(--ink); color:var(--paper);}
.thread-chart{width:100%; height:auto; margin:8px 0 4px;}
.dash-section{background:var(--card); border-radius:18px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow-soft);}
.dash-section h3{font-size:1.05rem;}
table.vartable{width:100%; border-collapse:collapse; font-size:.88rem;}
table.vartable th, table.vartable td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--paper-dim);}
table.vartable th{color:var(--ink-soft); font-weight:600;}
.small-note{color:var(--ink-faint); font-size:.8rem; margin-top:10px;}
.back-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}

@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ SPLASH ============ -->
  <section id="view-splash" class="view active" onclick="skipSplash()">
    <div class="splash-logo-wrap">
      <img class="splash-logo" src="https://res.cloudinary.com/dway4iqeh/image/upload/v1784773375/WhatsApp_Image_2026-07-22_at_22.20.54_jsiolj.jpg" alt="Memoria AI">
    </div>
    <div class="splash-caption">Preparando tu conversación de hoy…</div>
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </section>

  <!-- ============ HOME ============ -->
  <section id="view-home" class="view">
    <button class="edit-name no-print" onclick="editName()">Cambiar nombre</button>
    <svg class="home-thread" viewBox="0 0 120 120" fill="none">
      <circle cx="60" cy="60" r="46" stroke="#C79A45" stroke-width="2" opacity="0.35"/>
      <circle cx="60" cy="18" r="5" fill="#C79A45"/>
      <circle cx="94" cy="42" r="4" fill="#6E8F7C" opacity="0.7"/>
      <circle cx="94" cy="78" r="4" fill="#6E8F7C" opacity="0.5"/>
      <circle cx="60" cy="102" r="4" fill="#6E8F7C" opacity="0.35"/>
      <circle cx="26" cy="78" r="4" fill="#6E8F7C" opacity="0.5"/>
      <circle cx="26" cy="42" r="4" fill="#6E8F7C" opacity="0.7"/>
    </svg>
    <div class="home-eyebrow">Memoria AI</div>
    <h1 class="home-greeting" id="homeGreeting">Buenos días</h1>
    <p class="home-sub" id="homeSub">¿Conversamos un rato, como todos los días?</p>
    <button class="mic-giant" onclick="startConversation()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
      Iniciar conversación
    </button>
    <div class="home-links no-print">
      <button class="link-ghost" onclick="showView('dashboard')">Panel familiar / médico</button>

  <!-- ============ CONVERSATION ============ -->
  <section id="view-conversation" class="view">
    <div class="conv-top no-print">
      <span class="module-pill" id="modulePill">Saludo</span>
      <button class="exit-link" onclick="endConversation(true)">Terminar</button>
    </div>
    <div class="conv-progress"><div class="conv-progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="conv-body">
      <div class="ai-bubble" id="aiBubble">Preparando la conversación…</div>
      <div class="user-live" id="userLive"></div>
    </div>
    <div class="conv-bottom">
      <button class="mic-btn" id="micBtn" onclick="toggleListening()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
      </button>
      <div class="mic-hint" id="micHint">Responde con calma, te estoy escuchando</div>
      <div class="type-fallback" id="typeFallback">
        <input type="text" id="typeInput" placeholder="Escribe tu respuesta aquí">
        <button class="btn btn-primary" onclick="submitTyped()">Enviar</button>
      </div>
      <button class="toggle-type" onclick="toggleTypeFallback()" id="toggleTypeBtn">Prefiero escribir</button>
    </div>
  </section>

  <!-- ============ SUMMARY ============ -->
  <section id="view-summary" class="view">
    <h2>Resumen de hoy</h2>
    <p class="small-note" id="summaryDate"></p>
    <div class="summary-score" id="scoreRing" style="--pct:0">
      <div class="summary-score-num" id="scoreNum">--</div>
      <div class="summary-score-label">Índice cognitivo</div>
    </div>
    <div class="alert-banner" id="alertBanner"></div>
    <div class="metric-grid" id="metricGrid"></div>
    <button class="btn btn-primary btn-full" onclick="showView('home')">Volver al inicio</button>
    <button class="btn btn-secondary btn-full no-print" style="margin-top:10px" onclick="showView('dashboard')">Ver evolución completa</button>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <section id="view-dashboard" class="view">
    <div class="back-row no-print">
      <button class="link-ghost" onclick="showView('home')">&larr; Inicio</button>
      <button class="link-ghost" id="exportBtn" onclick="window.print()">Exportar PDF</button>
    </div>
    <h2 id="dashTitle">Evolución de <span id="dashUserName">--</span></h2>

      <button class="dash-tab active" id="tabFamiliar" onclick="setDashTab('familiar')">Panel familiar</button>
      <button class="dash-tab" id="tabMedico" onclick="setDashTab('medico')">Panel médico</button>
    </div>
    <div id="dashContent"></div>

</div>

<script>
/* =========================================================
   ESTADO Y PERSISTENCIA
========================================================= */
const STORE_KEY = 'memoria-sessions';
const NAME_KEY = 'memoria-user-name';
let userName = '';  // sin valor predefinido: se pide la primera vez que se abre la app
let sessions = [];

/* Guardado en el dispositivo (localStorage del navegador), para que la app recuerde
   el nombre y el historial de conversaciones cada vez que se abre, sin depender de
   ningún servidor. */
function loadStorage(){
  try{
    const savedName = localStorage.getItem(NAME_KEY);
    if(savedName) userName = savedName;
  }catch(e){ /* localStorage no disponible (modo privado muy restrictivo, etc.) */ }
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) sessions = JSON.parse(raw);
  }catch(e){ sessions = []; }
}
function saveSessions(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(sessions)); }
  catch(e){ console.error('No se pudo guardar la sesión', e); }
}
function saveName(){
  try{ localStorage.setItem(NAME_KEY, userName); }catch(e){}
}

/* Primera vez que se abre la app en este dispositivo: pide el nombre y lo recuerda para siempre. */
function ensureName(){
  if(userName) return;
  let val = null;
  while(!val){
    val = prompt('Bienvenido/a a Memoria AI. ¿Cómo le gustaría que la llamemos?');
    if(val && val.trim()) val = val.trim();
    else if(val === null){ val = 'Usuario'; break; } // la persona canceló el cuadro de diálogo
    else val = null;
  }
  userName = val;
  saveName();
}

/* =========================================================
   MÓDULOS DE CONVERSACIÓN
========================================================= */
const MODULES = [
  {id:'saludo', titulo:'Saludo', goal:'Saluda con calidez a {name} y pregúntale cómo amaneció o cómo se siente en este momento.'},
  {id:'rutina', titulo:'Rutina de hoy', goal:'Pregunta de forma natural qué desayunó y qué planes tiene para el resto del día.'},
  {id:'memoria_reciente', titulo:'Memoria reciente', goal:'Pregunta con naturalidad qué almorzó ayer, o quién la llamó o visitó esta semana.'},
  {id:'orientacion', titulo:'Orientación', goal:'Pregunta de forma casual qué día de la semana es hoy y en qué ciudad o lugar se encuentra.'},
  {id:'atencion_fijacion', titulo:'Atención', goal:'Menciona con naturalidad tres palabras para que las recuerde más tarde en la charla: Casa, Flor y Perro. Pídele que las repita ahora mismo, como un juego, no como examen.'},
  {id:'lenguaje', titulo:'Lenguaje', goal:'Pídele, con curiosidad genuina, que cuente paso a paso cómo prepararía un té o un café.'},
  {id:'ejecutivas', titulo:'Resolviendo problemas', goal:'Plantea con tono ligero: si se cortara la luz en la casa ahora mismo, ¿qué haría primero?'},
  {id:'narracion', titulo:'Un recuerdo', goal:'Pide con cariño que cuente algún recuerdo bonito de su infancia o juventud.'},
  {id:'atencion_recuerdo', titulo:'Atención', goal:'Pregunta, como si fuera curiosidad, si recuerda las tres palabras que mencionaste antes (Casa, Flor, Perro), sin repetírselas.'},
  {id:'despedida', titulo:'Despedida', goal:'Agradece la conversación con calidez genuina y despídete hasta la próxima charla.'}
];

const FALLBACK_LINES = {
  saludo: `Buenos días, {name}. ¿Cómo amaneció hoy?`,
  rutina: `Cuénteme, ¿qué desayunó esta mañana? ¿Tiene algún plan para hoy?`,
  memoria_reciente: `¿Qué almorzó ayer? ¿La llamó o la visitó alguien esta semana?`,
  orientacion: `Se me fue el hilo por un momento… ¿qué día de la semana es hoy? ¿Y dónde estamos?`,
  atencion_fijacion: `Le voy a decir tres palabras para que las recuerde más tarde: Casa, Flor y Perro. ¿Me las repite ahora?`,
  lenguaje: `Tengo ganas de tomar un té. ¿Me cuenta paso a paso cómo lo prepararía?`,
  ejecutivas: `Imagínese que de repente se corta la luz en su casa. ¿Qué haría primero?`,
  narracion: `Cuénteme algún recuerdo bonito de su infancia o de cuando era joven.`,
  atencion_recuerdo: `Antes le mencioné tres palabras. ¿Se acuerda cuáles eran?`,
  despedida: `Fue muy lindo conversar con usted, {name}. Que tenga un excelente día. ¡Hasta la próxima charla!`
};

/* =========================================================
   RECONOCIMIENTO Y SÍNTESIS DE VOZ
========================================================= */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let listening = false;

let cachedVoices = [];
function refreshVoices(){ cachedVoices = window.speechSynthesis.getVoices(); }
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

/* Elige la mejor voz en español disponible en el navegador/dispositivo, priorizando
   las voces neuronales u "online" (mucho más naturales) sobre las locales clásicas,
   que suelen sonar robóticas. La calidad final depende de las voces que traiga
   instaladas el navegador/sistema operativo de quien use la app. */
function pickLatamVoice(){
  const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
  const esVoices = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('es'));
  if(!esVoices.length) return null;

  const scored = esVoices.map(v=>{
    const name = v.name.toLowerCase();
    const lang = v.lang.toLowerCase();
    let score = 0;
    if(/natural|online|neural|wavenet/.test(name)) score += 50; // voces neuronales, mucho más naturales
    if(/google/.test(name)) score += 20;
    if(lang==='es-cl') score += 15;
    else if(lang==='es-mx' || lang==='es-us' || lang==='es-419' || lang==='es-ar') score += 10;
    else if(lang==='es-es') score -= 8; // preferimos evitar acento de España si hay alternativa latina
    if(!v.localService) score += 8; // las voces de red suelen sonar mejor que las locales del sistema
    return {voice:v, score};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored[0].voice;
}

function speak(text){
  return new Promise(resolve=>{
    try{
      window.speechSynthesis.cancel();
      const voice = pickLatamVoice();
      // Hablar frase por frase (con una pequeña pausa entre ellas) suena más a una
      // persona conversando que una sola oración larga y monótona. Además variamos
      // levemente el ritmo, el tono y la duración de la pausa entre frases: hablar
      // siempre con el mismo valor exacto es lo que delata a una voz sintética.
      const parts = text.split(/(?<=[.!?…])\s+/).filter(Boolean);
      const queue = parts.length ? parts : [text];
      let i = 0;
      const speakNext = ()=>{
        if(i >= queue.length){ resolve(); return; }
        const u = new SpeechSynthesisUtterance(queue[i]);
        u.lang = 'es-CL';
        u.rate = 0.94 + Math.random()*0.08;   // ~0.94–1.02, leve variación natural de ritmo
        u.pitch = 0.97 + Math.random()*0.06;  // ~0.97–1.03, leve variación natural de tono
        u.volume = 1.0;
        if(voice) u.voice = voice;
        const esUltima = i>=queue.length-1;
        const esPregunta = /[?¿]\s*$/.test(queue[i]);
        const pausaMs = esUltima ? 0 : (esPregunta ? 320 : 160) + Math.round(Math.random()*160);
        u.onend = ()=>{ i++; setTimeout(speakNext, pausaMs); };
        u.onerror = ()=>{ i++; setTimeout(speakNext, 0); };
        window.speechSynthesis.speak(u);
      };
      speakNext();
    }catch(e){ resolve(); }
  });
}

/* Escucha automática afinada para adultos mayores: el micrófono se activa solo apenas
   termina de hablar la IA, y el turno NO se da por terminado hasta que hay un silencio
   real después de que la persona habló. Las personas mayores suelen hacer pausas más
   largas para pensar antes y durante su respuesta, así que le damos más margen que a
   una conversación "apurada". Además, si el navegador corta el reconocimiento solo
   (algo común incluso en modo "continuo", cada 5-10 segundos aprox.), se reinicia
   automáticamente sin perder lo ya dicho, en vez de cortar la respuesta a medias. */
const SILENCE_MS  = 4200;   // silencio real tras hablar = recién ahí se da la respuesta por terminada
const MAX_WAIT_MS = 22000;  // tiempo de espera si todavía no empieza a responder
const MAX_TURN_MS = 90000;  // tope absoluto de seguridad por turno
let manualStopResolve = null; // permite al botón forzar el cierre del turno actual

function listenAuto(){
  return new Promise(resolve=>{
    if(!SpeechRecognitionAPI){ resolve(''); return; }
    const micBtn = document.getElementById('micBtn');
    const live = document.getElementById('userLive');
    const hint = document.getElementById('micHint');
    let finalText = '';
    let hasSpoken = false;
    let settled = false;
    let watchdog = null;
    const turnStart = Date.now();

    const clearWatchdog = ()=>{ if(watchdog){ clearTimeout(watchdog); watchdog=null; } };

    const finish = ()=>{
      if(settled) return;
      settled = true;
      clearWatchdog();
      manualStopResolve = null;
      if(recognizer){
        recognizer.onresult=null; recognizer.onend=null; recognizer.onerror=null;
        recognizer.onstart=null; recognizer.onspeechstart=null;
        try{ recognizer.stop(); }catch(e){}
      }
      listening=false; micBtn.classList.remove('listening');
      resolve(finalText.trim());
    };
    manualStopResolve = finish;

    // El "vigía" decide cuándo cerrar el turno: espera un silencio real tras la voz,
    // o el tiempo máximo de paciencia si la persona todavía no empieza a hablar.
    const armWatchdog = ()=>{
      clearWatchdog();
      watchdog = setTimeout(finish, hasSpoken ? SILENCE_MS : MAX_WAIT_MS);
    };

    const startCycle = ()=>{
      if(settled) return;
      recognizer = new SpeechRecognitionAPI();
      recognizer.lang = 'es-CL';
      recognizer.interimResults = true;
      recognizer.continuous = true;
      recognizer.maxAlternatives = 1;

      recognizer.onstart = ()=>{
        listening=true; micBtn.classList.add('listening');
        hint.textContent = hasSpoken ? 'Tómese su tiempo, lo sigo escuchando…' : 'Le escucho, responda cuando quiera…';
        armWatchdog();
      };
      recognizer.onresult = (ev)=>{
        hasSpoken = true;
        let interim='';
        for(let i=ev.resultIndex;i<ev.results.length;i++){
          const t = ev.results[i][0].transcript;
          if(ev.results[i].isFinal) finalText += t + ' ';
          else interim += t;
        }
        // No se muestra la transcripción en pantalla; queda solo interna (en finalText) para el análisis.
        hint.textContent = 'Le escucho…';
        armWatchdog();
      };
      recognizer.onspeechstart = ()=>{ hasSpoken = true; armWatchdog(); };
      recognizer.onerror = (e)=>{
        if(settled) return;
        if(e && e.error==='aborted') return; // provocado por nuestro propio stop(), se ignora
        // Errores pasajeros (silencio interno del motor, red, etc.): reintentamos
        // sin dar la respuesta por cortada, para no perder lo que la persona alcanzó a decir.
        if(Date.now()-turnStart < MAX_TURN_MS){ setTimeout(startCycle, 300); }
        else finish();
      };
      recognizer.onend = ()=>{
        if(settled) return;
        listening=false; micBtn.classList.remove('listening');
        // El navegador corta la escucha solo de tanto en tanto incluso en modo continuo;
        // como una persona mayor puede estar a mitad de una pausa para pensar, la reanudamos
        // automáticamente sin perder el texto ya capturado, en vez de cerrar el turno antes de tiempo.
        if(Date.now()-turnStart < MAX_TURN_MS){ setTimeout(startCycle, 300); }
        else finish();
      };
      try{ recognizer.start(); }catch(e){ finish(); }
    };

    startCycle();
  });
}

/* El botón del micrófono ya no es obligatorio: solo permite cerrar el turno antes si la persona ya terminó de hablar */
function toggleListening(){
  if(!SpeechRecognitionAPI){ toggleTypeFallback(true); return; }
  if(listening && manualStopResolve){ manualStopResolve(); }
}

/* Fallback de texto (para navegadores sin reconocimiento de voz, o preferencia del usuario) */
let typedResolve = null;
function toggleTypeFallback(force){
  const el = document.getElementById('typeFallback');
  const btn = document.getElementById('toggleTypeBtn');
  const showType = force===true || !el.classList.contains('active');
  el.classList.toggle('active', showType);
  btn.textContent = showType ? 'Prefiero hablar' : 'Prefiero escribir';
  document.getElementById('micBtn').style.display = showType ? 'none' : 'flex';
  if(showType && listening && manualStopResolve){ manualStopResolve(); }
}
function submitTyped(){
  const input = document.getElementById('typeInput');
  const val = input.value.trim();
  if(!val) return;
  document.getElementById('userLive').textContent = val;
  input.value='';
  if(typedResolve){ const r = typedResolve; typedResolve=null; r(val); }
}

/* Une reconocimiento por voz (automático) y por texto en una sola espera de "turno del usuario" */
function waitForUserTurn(){
  const typeActive = document.getElementById('typeFallback').classList.contains('active');
  if(typeActive){
    document.getElementById('micHint').textContent = 'Escribe tu respuesta y toca enviar';
    return new Promise(resolve=>{ typedResolve = resolve; });
  }
  document.getElementById('micHint').textContent = 'Responde cuando quieras, te escucho automáticamente';
  return listenAuto();
}

/* =========================================================
   MOTOR CONVERSACIONAL (Claude API)
========================================================= */
async function askClaude(systemPrompt, history){
  try{
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:220,
        system: systemPrompt,
        messages: history
      })
    });
    const data = await response.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
    return text || null;
  }catch(e){
    console.warn('Claude API no disponible, usando línea de respaldo.', e);
    return null;
  }
}

const SYSTEM_PROMPT = `Eres la voz de Memoria AI, una compañía conversacional cálida para adultos mayores en Chile.
Hablas en español latinoamericano (chileno), tratando a {name} de usted con cariño, como alguien que realmente disfruta conversar, nunca como un examen ni una entrevista clínica.
Reglas estrictas de idioma:
- Usa SIEMPRE español latinoamericano/chileno. Nunca uses "vosotros", "vale", "coger", "ordenador" ni otros modismos de España.
Reglas de forma:
- Responde SOLO con la próxima frase que dirías en voz alta. Nada de explicaciones, nada de comillas, nada de etiquetas.
- Máximo 2 frases cortas, tono natural, cálido y pausado.
- Debes lograr el objetivo del turno actual (ver abajo) de forma disimulada, como parte genuina de la charla.
- Si {name} ya respondió algo en el turno anterior, reconócelo brevemente antes de continuar (por ejemplo, un comentario breve, cálido y específico) y luego avanza al objetivo.
- Nunca menciones que esto es una evaluación, prueba, test o monitoreo cognitivo.`;

/* =========================================================
   ANÁLISIS DE MÉTRICAS
========================================================= */
const FILLERS = /\b(eh+|em+|mm+|este|o sea|osea|bueno\.\.\.|pucha|cachai|ehh+)\b/gi;

function analyzeTranscript(turns){
  // turns: [{module, aiText, userText, latencyMs, userDurationMs}]
  let totalWords=0, uniqueWords=new Set(), fillerCount=0, longPauses=0, pauseSum=0;
  let totalUserDurationMs=0;
  let compliantTurns=0;

  turns.forEach(t=>{
    const words = (t.userText||'').trim().split(/\s+/).filter(Boolean);
    totalWords += words.length;
    words.forEach(w=>uniqueWords.add(w.toLowerCase().replace(/[^\wáéíóúñ]/gi,'')));
    const fm = (t.userText||'').match(FILLERS);
    if(fm) fillerCount += fm.length;
    if(t.latencyMs && t.latencyMs > 3000){ longPauses++; pauseSum += t.latencyMs; }
    if(t.userDurationMs) totalUserDurationMs += t.userDurationMs;
    if(words.length >= 3) compliantTurns++;
  });

  const lexicalDiversity = totalWords>0 ? Math.min(100, Math.round((uniqueWords.size/totalWords)*100)) : 0;
  const avgPauseSec = longPauses>0 ? +(pauseSum/longPauses/1000).toFixed(1) : 0;
  const minutes = Math.max(totalUserDurationMs/60000, 0.3);
  const wordsPerMin = Math.round(totalWords/minutes);
  const comprensionScore = Math.round((compliantTurns/turns.length)*100);

  // Módulo de atención - recuerdo de palabras
  const recallTurn = turns.find(t=>t.module==='atencion_recuerdo');
  const targetWords = ['casa','flor','perro'];
  let recalled = 0;
  if(recallTurn){
    const low = (recallTurn.userText||'').toLowerCase();
    targetWords.forEach(w=>{ if(low.includes(w)) recalled++; });
  }
  const fijacionTurn = turns.find(t=>t.module==='atencion_fijacion');
  let fijacionOk = 0;
  if(fijacionTurn){
    const low = (fijacionTurn.userText||'').toLowerCase();
    targetWords.forEach(w=>{ if(low.includes(w)) fijacionOk++; });
  }
  const memoriaInmediata = Math.round((fijacionOk/3)*100);
  const memoriaDiferida = Math.round((recalled/3)*100);
  const memoriaReciente = turns.find(t=>t.module==='memoria_reciente');
  const memoriaRecienteScore = memoriaReciente && (memoriaReciente.userText||'').trim().split(/\s+/).filter(Boolean).length>=3 ? 100 : 40;
  const memoriaScore = Math.round((memoriaInmediata*0.35 + memoriaDiferida*0.4 + memoriaRecienteScore*0.25));

  // Orientación (heurística simplificada; un producto real usaría NLP dedicado)
  const orientTurn = turns.find(t=>t.module==='orientacion');
  let orientacionScore = 40;
  if(orientTurn){
    const low = (orientTurn.userText||'').toLowerCase();
    const dias = ['lunes','martes','miércoles','miercoles','jueves','viernes','sábado','sabado','domingo'];
    const hoyDia = new Date().toLocaleDateString('es-CL',{weekday:'long'}).toLowerCase();
    let score = 0;
    if(dias.some(d=>low.includes(d))) score += low.includes(hoyDia) ? 60 : 30;
    if(low.trim().split(/\s+/).filter(Boolean).length >= 3) score += 40;
    orientacionScore = Math.min(100, score);
  }

  // Coherencia: combinación de diversidad léxica, cumplimiento y fluidez
  const fluencyPenalty = Math.min(30, fillerCount*3 + longPauses*4);
  const coherenciaScore = Math.max(0, Math.round((lexicalDiversity*0.4 + comprensionScore*0.6) - fluencyPenalty*0.3));

  const indiceCognitivo = Math.max(0, Math.min(100, Math.round(
    memoriaScore*0.28 + orientacionScore*0.18 + comprensionScore*0.22 + coherenciaScore*0.22 +
    Math.max(0, 10 - Math.round(fluencyPenalty/4))
  )));

  return {
    totalWords, wordsPerMin, longPauses, avgPauseSec, lexicalDiversity, fillerCount,
    memoriaScore, orientacionScore, comprensionScore, coherenciaScore, indiceCognitivo,
    durationSec: Math.round(totalUserDurationMs/1000)
  };
}

/* =========================================================
   FLUJO DE CONVERSACIÓN
========================================================= */
let currentTurns = [];
let currentModuleIndex = 0;

async function startConversation(){
  currentTurns = [];
  currentModuleIndex = 0;
  showView('conversation');
  document.getElementById('typeFallback').classList.remove('active');
  document.getElementById('micBtn').style.display = 'flex';
  document.getElementById('toggleTypeBtn').textContent = 'Prefiero escribir';
  await runModule();
}

async function runModule(){
  if(currentModuleIndex >= MODULES.length){
    await finishConversation();
    return;
  }
  const mod = MODULES[currentModuleIndex];
  document.getElementById('modulePill').textContent = mod.titulo;
  document.getElementById('progressFill').style.width = Math.round((currentModuleIndex/MODULES.length)*100)+'%';

  const bubble = document.getElementById('aiBubble');
  bubble.classList.add('thinking');
  bubble.textContent = '…';

  const history = currentTurns.slice(-3).flatMap(t=>[
    {role:'assistant', content:t.aiText},
    {role:'user', content:t.userText || '(sin respuesta clara)'}
  ]);
  history.push({role:'user', content:`[Objetivo del turno actual — ${mod.titulo}]: ${mod.goal.replace('{name}', userName)}`});

  const sysPrompt = SYSTEM_PROMPT.replace(/{name}/g, userName);
  let aiText = await askClaude(sysPrompt, history.length ? history : [{role:'user', content:mod.goal.replace('{name}', userName)}]);
  if(!aiText) aiText = FALLBACK_LINES[mod.id].replace('{name}', userName);

  bubble.classList.remove('thinking');
  bubble.textContent = aiText;
  document.getElementById('userLive').textContent = '';

  const speakStart = performance.now();
  await speak(aiText);
  const aiSpeechEnd = performance.now();

  const userStart = performance.now();
  const userText = await waitForUserTurn();
  const userEnd = performance.now();

  currentTurns.push({
    module: mod.id,
    aiText, userText,
    latencyMs: userStart - aiSpeechEnd,
    userDurationMs: Math.max(userEnd - userStart, 1200)
  });

  currentModuleIndex++;
  await runModule();
}

function endConversation(early){
  window.speechSynthesis.cancel();
  if(recognizer){ try{ recognizer.stop(); }catch(e){} }
  if(early && currentTurns.length < 3){ showView('home'); return; }
  finishConversation();
}

async function finishConversation(){
  window.speechSynthesis.cancel();
  const metrics = analyzeTranscript(currentTurns);
  const session = {
    id: 'sess_' + Date.now(),
    date: new Date().toISOString(),
    userName,
    ...metrics,
    transcript: currentTurns
  };
  sessions.push(session);
  await saveSessions();
  renderSummary(session);
  showView('summary');
}

/* =========================================================
   RESUMEN DE SESIÓN
========================================================= */
function computeAlert(sessAll){
  if(sessAll.length < 3){
    return {level:'green', text:'Aún estamos estableciendo la línea base personal. Se necesitan algunas conversaciones más para detectar tendencias.'};
  }
  const recent = sessAll.slice(-5).map(s=>s.indiceCognitivo);
  const baseline = sessAll.slice(0, -3).length
    ? avg(sessAll.slice(0, -3).map(s=>s.indiceCognitivo))
    : avg(recent);
  const last = recent[recent.length-1];
  const variacion = baseline>0 ? ((last-baseline)/baseline)*100 : 0;
  const decliningStreak = recent.length>=3 && recent[recent.length-1]<recent[recent.length-2] && recent[recent.length-2]<recent[recent.length-3];

  if(variacion <= -20 || (decliningStreak && variacion <= -15)){
    return {level:'red', text:`Se detectaron cambios importantes respecto a la línea base personal (${variacion.toFixed(0)}%). Se recomienda notificar a un familiar y agendar una evaluación médica.`};
  }
  if(variacion <= -12 || decliningStreak){
    return {level:'orange', text:`Disminución progresiva durante las últimas conversaciones (${variacion.toFixed(0)}%). Se recomienda una evaluación médica de control.`};
  }
  if(variacion <= -5){
    return {level:'yellow', text:`Cambios leves y persistentes respecto a la línea base (${variacion.toFixed(0)}%). Aumentaremos la frecuencia de seguimiento.`};
  }
  return {level:'green', text:'Sin cambios significativos respecto a la línea base personal.'};
}
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }

function renderSummary(session){
  document.getElementById('summaryDate').textContent = new Date(session.date).toLocaleString('es-CL', {dateStyle:'long', timeStyle:'short'});
  document.getElementById('scoreNum').textContent = session.indiceCognitivo;
  document.getElementById('scoreRing').style.setProperty('--pct', session.indiceCognitivo);

  const alert = computeAlert(sessions);
  const banner = document.getElementById('alertBanner');
  banner.className = 'alert-banner alert-' + alert.level;
  banner.innerHTML = `<div class="alert-dot"></div><div>${alert.text}</div>`;

  const grid = document.getElementById('metricGrid');
  grid.innerHTML = `
    <div class="metric-card"><div class="val">${session.durationSec}s</div><div class="lab">Duración</div></div>
    <div class="metric-card"><div class="val">${session.totalWords}</div><div class="lab">Palabras pronunciadas</div></div>
    <div class="metric-card"><div class="val">${session.wordsPerMin}</div><div class="lab">Palabras / min</div></div>
    <div class="metric-card"><div class="val">${session.longPauses} (${session.avgPauseSec}s prom.)</div><div class="lab">Pausas largas</div></div>
    <div class="metric-card"><div class="val">${session.coherenciaScore}%</div><div class="lab">Coherencia</div></div>
    <div class="metric-card"><div class="val">${session.lexicalDiversity}%</div><div class="lab">Diversidad léxica</div></div>
    <div class="metric-card"><div class="val">${session.memoriaScore}%</div><div class="lab">Memoria</div></div>
    <div class="metric-card"><div class="val">${session.orientacionScore}%</div><div class="lab">Orientación</div></div>
  `;
}

function threadChartSVG(sessAll){
  const w=640, h=160, pad=24;
  if(sessAll.length===0){
    return `<svg class="thread-chart" viewBox="0 0 ${w} ${h}"><text x="${w/2}" y="${h/2}" text-anchor="middle" fill="#7C9491" font-size="14">Aún no hay conversaciones registradas</text></svg>`;
  }
  const vals = sessAll.map(s=>s.indiceCognitivo);
  const n = vals.length;
  const stepX = n>1 ? (w-pad*2)/(n-1) : 0;
  const pts = vals.map((v,i)=>{
    const x = pad + stepX*i;
    const y = h-pad - (v/100)*(h-pad*2);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = pts.map((p,i)=>{
    const isLast = i===pts.length-1;
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${isLast?7:4.5}" fill="${isLast?'#C79A45':'#6E8F7C'}" />`;
  }).join('');
  return `<svg class="thread-chart" viewBox="0 0 ${w} ${h}">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#F1EAD9" stroke-width="2"/>
    <path d="${path}" fill="none" stroke="#C79A45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    ${dots}
  </svg>`;
}

function renderDashboard(){
  document.getElementById('dashUserName').textContent = userName;
  const content = document.getElementById('dashContent');
  const alert = computeAlert(sessions);
  const last = sessions[sessions.length-1];
  const prevMonthSess = sessions.filter(s=> (Date.now()-new Date(s.date).getTime()) > 25*86400000 && (Date.now()-new Date(s.date).getTime()) < 40*86400000);
  const variacionMes = last && prevMonthSess.length ? Math.round(((last.indiceCognitivo - avg(prevMonthSess.map(s=>s.indiceCognitivo)))/avg(prevMonthSess.map(s=>s.indiceCognitivo)))*100) : null;

  if(dashTab==='familiar'){
    const last7 = sessions.filter(s=> (Date.now()-new Date(s.date).getTime()) < 7*86400000).length;
    content.innerHTML = `
      <div class="dash-section">
        <div class="alert-banner alert-${alert.level}"><div class="alert-dot"></div><div>${alert.text}</div></div>
      </div>
      <div class="dash-section">
        <h3>Evolución del índice cognitivo</h3>
        ${threadChartSVG(sessions)}
        <p class="small-note">Cada punto representa una conversación. El punto dorado es la más reciente.</p>
      </div>
      <div class="metric-grid">
        <div class="metric-card"><div class="val">${last ? last.indiceCognitivo : '--'}</div><div class="lab">Índice actual</div></div>
        <div class="metric-card"><div class="val">${last ? new Date(last.date).toLocaleDateString('es-CL') : '--'}</div><div class="lab">Última conversación</div></div>
        <div class="metric-card"><div class="val">${variacionMes!==null ? (variacionMes>0?'+':'')+variacionMes+'%' : 'Sin datos'}</div><div class="lab">Variación vs. mes anterior</div></div>
        <div class="metric-card"><div class="val">${last7}/7</div><div class="lab">Conversaciones esta semana</div></div>
      </div>
      <p class="small-note">Memoria AI es una herramienta de apoyo y seguimiento, no reemplaza una evaluación médica formal.</p>
    `;
  }else{
    const rows = sessions.slice().reverse().map(s=>`
      <tr>
        <td>${new Date(s.date).toLocaleDateString('es-CL')}</td>
        <td>${s.indiceCognitivo}</td>
        <td>${s.memoriaScore}%</td>
        <td>${s.orientacionScore}%</td>
        <td>${s.comprensionScore}%</td>
        <td>${s.coherenciaScore}%</td>
        <td>${s.lexicalDiversity}%</td>
        <td>${s.wordsPerMin}</td>
        <td>${s.longPauses}</td>
        <td>${s.fillerCount}</td>
      </tr>`).join('');
    content.innerHTML = `
      <div class="dash-section">
        <div class="alert-banner alert-${alert.level}"><div class="alert-dot"></div><div>${alert.text}</div></div>
      </div>
      <div class="dash-section">
        <h3>Resumen ejecutivo</h3>
        <p>${userName} ha completado ${sessions.length} conversación(es) registradas. Índice cognitivo actual: <strong>${last?last.indiceCognitivo:'--'}</strong>/100${variacionMes!==null?` (variación de ${variacionMes>0?'+':''}${variacionMes}% vs. mes anterior)`:''}. Nivel de alerta: <strong>${alert.level.toUpperCase()}</strong>.</p>
      </div>
      <div class="dash-section">
        <h3>Evolución del índice cognitivo</h3>
        ${threadChartSVG(sessions)}
      </div>
      <div class="dash-section">
        <h3>Historial de variables por sesión</h3>
        <div style="overflow-x:auto;">
        <table class="vartable">
          <tr><th>Fecha</th><th>Índice</th><th>Memoria</th><th>Orient.</th><th>Compr.</th><th>Coher.</th><th>Léxico</th><th>Pal/min</th><th>Pausas</th><th>Muletillas</th></tr>
          ${rows || '<tr><td colspan="10">Sin sesiones registradas aún</td></tr>'}
        </table>
        </div>
        <p class="small-note">Variables acústicas y lingüísticas completas (prosodia, temblor, latencia por turno, anomias) requerirían integración con motores dedicados de análisis de audio (p. ej. openSMILE/librosa) y de PLN (spaCy/BERT en español) en el backend clínico — no incluidos en este prototipo de interfaz.</p>
      </div>
    `;
  }
}

  document.getElementById('homeGreeting').textContent = `${saludo}, ${userName}`;
  document.getElementById('homeSub').textContent = sessions.length
    ? '¿Conversamos un rato, como todos los días?'
    : 'Toquemos el botón para tener nuestra primera conversación.';
}

async function editName(){
  const val = prompt('¿Cómo te gustaría que te llamemos?', userName);
  if(val && val.trim()){
    userName = val.trim();
    await saveName();
    renderHome();
  }
}

/* =========================================================
   SPLASH
========================================================= */
let splashTimer = null;
let splashDone = false;

function skipSplash(){
  if(splashDone) return;
  splashDone = true;
  if(splashTimer) clearTimeout(splashTimer);
  window.speechSynthesis.cancel();
  showView('home');
}

function playSplash(){
  const saludoNombre = userName ? `Hola, ${userName}. ` : 'Hola. ';
  speak(`${saludoNombre}Bienvenida a Memoria AI.`);
  splashTimer = setTimeout(()=>{
    if(!splashDone){ splashDone = true; showView('home'); }
  }, 5000);
}

/* =========================================================
   INICIO
========================================================= */
(async function init(){
  await loadStorage();
  if(!SpeechRecognitionAPI){
    document.getElementById('micHint').textContent = 'Tu navegador no soporta voz; usa el modo escribir.';
  }
  renderHome();
  playSplash();
})();
</script>
</body>
</html>
